auth.onAuthStateChanged(user => {
    if (user && user.email === ADMIN_EMAIL) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadCurrentConfig();

function adminLogin() {
    const e = document.getElementById("email").value, p = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(e, p).catch(err => Swal.fire("登入失敗", err.message, "error"));
}
function logout() { auth.signOut(); location.reload(); }

function loadCurrentConfig() {
    db.collection("systemConfig").doc("main").get().then(doc => {
        if (doc.exists) {
            const data = doc.data();
            document.getElementById("announcement").value = data.announcement || "";
            document.getElementById("updateTime").value = data.updateTime || "";
        }
    });
}

function saveSystemConfig() {
    db.collection("systemConfig").doc("main").set({
        announcement: document.getElementById("announcement").value,
        updateTime: document.getElementById("updateTime").value,
        lastEditedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge: true}).then(() => Swal.fire("成功", "設定已發布！", "success"));
}

// 🌟 新增單一客運功能
async function addNewOperator() {
    const id = document.getElementById("newOpId").value.trim();
    const name = document.getElementById("newOpName").value.trim();
    const group = document.getElementById("newOpGroup").value;
    const stationsStr = document.getElementById("newOpStations").value;
    
    if(!id || !name) return Swal.fire("警告", "代碼與名稱為必填", "warning");

    const stations = stationsStr.split(",").map(s => s.trim()).filter(s => s);

    try {
        const docRef = db.collection("systemConfig").doc("operators");
        const docSnap = await docRef.get();
        let data = docSnap.exists ? docSnap.data() : { OPERATOR_NAMES: {}, operatorToManufacturer: {}, groups: {} };
        
        // 確保群組陣列存在
        if (!data.groups[group]) data.groups[group] = [];
        
        // 寫入資料
        data.OPERATOR_NAMES[id] = name;
        data.operatorToManufacturer[id] = stations;
        if (!data.groups[group].includes(id)) {
            data.groups[group].push(id);
        }

        await docRef.set(data);
        Swal.fire("成功", `客運 [${name}] 已新增！`, "success");
        
        // 清空輸入框
        document.getElementById("newOpId").value = "";
        document.getElementById("newOpName").value = "";
        document.getElementById("newOpStations").value = "";
    } catch(e) {
        Swal.fire("錯誤", e.message, "error");
    }
}
